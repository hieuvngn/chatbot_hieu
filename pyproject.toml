[project]
name = "coursemate-rag"
version = "0.1.0"
description = "CourseMate RAG chatbot: course advisory and knowledge Q&A grounded in study documents."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.30",
    "bitsandbytes>=0.44",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "torch>=2.6",
    "transformers>=4.41,<5",
    "streamlit>=1.62.0",
    "pypdf>=4.0",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
serve = "server.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = ["app.py", "generate_data.py", "eval.py", "rag_core", "tests", "server"]
